<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog | 青木 壯磨のブログ</title>
  <meta name="description" content="研究の進捗や日々の学び、音楽のことなどを書くブログです。">
  <style>
    :root {
      --blue-900: #082a5e;
      --blue-800: #0b3d91;
      --blue-600: #0b63e5;
      --blue-400: #38bdf8;
      --blue-100: #dbeafe;
      --blue-50:  #eef5ff;
      --ink: #12263f;
      --muted: #47617f;
      --placeholder: #647f9f;
      --bg: #f2f7ff;
      --surface: #ffffff;
      --border: #c9dcf5;
      --radius: 16px;
      --shadow: 0 10px 30px rgba(11, 61, 145, 0.10);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #071528;
        --surface: #0d2138;
        --ink: #e8f1fd;
        --muted: #a9c2de;
        --placeholder: #8fb0d6;
        --border: #1e4066;
        --blue-50: #0a1f3a;
        --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      }
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      * { transition: none !important; }
    }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
        "Hiragino Sans", "Yu Gothic UI", "Yu Gothic", Meiryo, sans-serif;
      font-size: 17px;
      line-height: 1.85;
      letter-spacing: 0.02em;
      -webkit-text-size-adjust: 100%;
    }
    a { color: var(--blue-600); }
    @media (prefers-color-scheme: dark) { a { color: var(--blue-400); } }
    a:focus-visible, .skip:focus-visible {
      outline: 3px solid var(--blue-400);
      outline-offset: 2px;
      border-radius: 4px;
    }
    .skip {
      position: absolute; left: -9999px; top: 0;
      background: var(--surface); padding: 12px 16px; z-index: 20;
    }
    .skip:focus-visible { left: 8px; top: 8px; }

    header.site-nav {
      position: sticky; top: 0; z-index: 10;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
    }
    @media (prefers-color-scheme: dark) {
      header.site-nav { background: rgba(7, 21, 40, 0.85); }
    }
    .nav-inner {
      max-width: 62rem; margin: 0 auto; padding: 0 20px;
      display: flex; flex-wrap: wrap; gap: 2px 6px; align-items: center;
    }
    .brand {
      font-weight: 800; color: var(--blue-800);
      margin-right: auto; padding: 8px 4px; font-size: 1rem;
    }
    .brand a { color: inherit; text-decoration: none; }
    @media (prefers-color-scheme: dark) { .brand { color: var(--blue-400); } }
    .nav-inner nav { display: flex; flex-wrap: wrap; gap: 2px 4px; }
    .nav-inner nav a {
      display: inline-flex; align-items: center; min-height: 44px;
      padding: 6px 10px; color: var(--ink); text-decoration: none; font-size: 0.95rem;
      border-radius: 8px;
    }
    .nav-inner nav a:hover { color: var(--blue-600); background: var(--blue-50); }

    .hero {
      background: linear-gradient(135deg, var(--blue-900) 0%, var(--blue-800) 42%, var(--blue-600) 78%, var(--blue-400) 125%);
      color: #ffffff;
    }
    .hero-inner { max-width: 62rem; margin: 0 auto; padding: 44px 20px 48px; }
    .hero .en {
      font-weight: 800; font-size: 0.85rem; letter-spacing: 0.14em;
      text-transform: uppercase; color: #bcd7ff; margin: 0 0 4px;
    }
    .hero h1 { font-size: 2rem; line-height: 1.35; margin: 0 0 8px; font-weight: 800; }
    .hero p { margin: 0; color: #eaf3ff; max-width: 36em; }

    main { max-width: 62rem; margin: 0 auto; padding: 40px 20px 8px; }
    section { margin-bottom: 44px; }
    h2 { font-size: 1.35rem; line-height: 1.45; margin: 0 0 16px; }
    h2::before {
      content: ""; display: inline-block;
      width: 10px; height: 1.05em; border-radius: 3px;
      background: linear-gradient(180deg, var(--blue-600), var(--blue-400));
      margin-right: 10px; vertical-align: -0.14em;
    }
    h3 { font-size: 1.12rem; line-height: 1.55; margin: 0 0 6px; }
    p { margin: 0 0 12px; }
    p:last-child { margin-bottom: 0; }
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 26px; box-shadow: var(--shadow);
    }
    .posts { display: grid; grid-template-columns: 1fr; gap: 16px; }
    article.post .date {
      color: var(--blue-800); font-weight: 700; font-size: 0.95rem; margin-bottom: 4px;
    }
    @media (prefers-color-scheme: dark) { article.post .date { color: var(--blue-400); } }
    .tag {
      display: inline-block; font-size: 0.75rem; font-weight: 700;
      color: var(--blue-800); background: var(--blue-100);
      border-radius: 6px; padding: 1px 8px; margin-bottom: 8px; letter-spacing: 0.06em;
    }
    @media (prefers-color-scheme: dark) { .tag { color: #bcd7ff; background: #14335c; } }
    .back { margin-top: 4px; }
    footer { border-top: 1px solid var(--border); background: var(--surface); }
    .footer-inner {
      max-width: 62rem; margin: 0 auto; padding: 22px 20px 30px;
      color: var(--muted); font-size: 0.9rem; text-align: center;
    }
  </style>
</head>
<body>
  <a class="skip" href="#main">本文へ移動</a>

  <header class="site-nav">
    <div class="nav-inner">
      <span class="brand"><a href="../">Portfolio</a></span>
      <nav aria-label="メニュー">
        <a href="../">ホーム</a>
        <a href="https://github.com/aokisoma">GitHub</a>
      </nav>
    </div>
  </header>

  <div class="hero">
    <div class="hero-inner">
      <p class="en">Blog</p>
      <h1>ブログ</h1>
      <p>研究の進捗や日々の学び、音楽のことなどを書く場所です。</p>
    </div>
  </div>

  <main id="main">
    <!-- ===== 記事一覧（新しい記事から順） ===== -->
    <section aria-label="記事一覧">
      <h2>記事一覧</h2>
      <div class="posts">
        <article class="card post">
          <span class="tag">お知らせ</span>
          <p class="date">2026.11.13</p>
          <h3><a href="./2026-11-13-homepage-open.html">ホームページを開設しました</a></h3>
          <p>個人ホームページを開設しました。自己紹介や研究内容、これまでに取り組んだプロジェクトなどをまとめています。</p>
        </article>
      </div>
      <p class="back"><a href="../">← ホームへ戻る</a></p>
    </section>
  </main>

  <footer>
    <div class="footer-inner">
      <p>&copy; 2026 青木 壯磨 — Built with GitHub Pages</p>
    </div>
  </footer>
</body>
</html>
