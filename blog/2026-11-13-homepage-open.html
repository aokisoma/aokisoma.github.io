<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ホームページを開設しました | 青木 壯磨のブログ</title>
  <meta name="description" content="個人ホームページを開設しました。自己紹介や研究内容、これまでに取り組んだプロジェクトなどをまとめています。">
  <style>
    :root {
      --blue-900: #082a5e;
      --blue-800: #0b3d91;
      --blue-600: #0b63e5;
      --blue-400: #38bdf8;
      --blue-100: #dbeafe;
      --blue-50:  #eef5ff;
      --ink: #12263f;
      --muted: #47617f;
      --bg: #f2f7ff;
      --surface: #ffffff;
      --border: #c9dcf5;
      --radius: 16px;
      --shadow: 0 10px 30px rgba(11, 61, 145, 0.10);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #071528;
        --surface: #0d2138;
        --ink: #e8f1fd;
        --muted: #a9c2de;
        --border: #1e4066;
        --blue-50: #0a1f3a;
        --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      }
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      * { transition: none !important; }
    }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
        "Hiragino Sans", "Yu Gothic UI", "Yu Gothic", Meiryo, sans-serif;
      font-size: 17px;
      line-height: 1.85;
      letter-spacing: 0.02em;
      -webkit-text-size-adjust: 100%;
    }
    a { color: var(--blue-600); }
    @media (prefers-color-scheme: dark) { a { color: var(--blue-400); } }
    a:focus-visible, .skip:focus-visible {
      outline: 3px solid var(--blue-400);
      outline-offset: 2px;
      border-radius: 4px;
    }
    .skip {
      position: absolute; left: -9999px; top: 0;
      background: var(--surface); padding: 12px 16px; z-index: 20;
    }
    .skip:focus-visible { left: 8px; top: 8px; }

    header.site-nav {
      position: sticky; top: 0; z-index: 10;
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(14px) saturate(1.5);
      -webkit-backdrop-filter: blur(14px) saturate(1.5);
      border-bottom: 1px solid transparent;
      transition: transform 0.32s ease, box-shadow 0.25s ease,
        background-color 0.25s ease, border-color 0.25s ease;
    }
    @media (prefers-color-scheme: dark) {
      header.site-nav { background: rgba(7, 21, 40, 0.72); }
    }
    header.site-nav.scrolled {
      background: rgba(255, 255, 255, 0.88);
      border-bottom-color: var(--border);
      box-shadow: 0 6px 24px rgba(11, 61, 145, 0.10);
    }
    @media (prefers-color-scheme: dark) {
      header.site-nav.scrolled {
        background: rgba(7, 21, 40, 0.88);
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.35);
      }
    }
    header.site-nav.nav-hidden { transform: translateY(-100%); }
    .scroll-progress {
      position: fixed; top: 0; left: 0; z-index: 30;
      width: 100%; height: 3px; pointer-events: none;
      background: linear-gradient(90deg, var(--blue-800), var(--blue-600), var(--blue-400));
      transform-origin: 0 50%; transform: scaleX(0);
    }
    .nav-inner {
      max-width: 62rem; margin: 0 auto; padding: 0 20px;
      display: flex; flex-wrap: nowrap; gap: 6px 14px; align-items: center;
    }
    .brand {
      display: inline-flex; align-items: center; gap: 9px;
      font-weight: 800; color: var(--blue-800); text-decoration: none;
      margin-right: auto; padding: 10px 2px; font-size: 1rem; white-space: nowrap;
    }
    .brand .mark {
      display: inline-flex; align-items: center; justify-content: center;
      width: 30px; height: 30px; border-radius: 50%; flex: none;
      background: linear-gradient(135deg, var(--blue-800), var(--blue-600) 60%, var(--blue-400));
      color: #ffffff; font-size: 0.85rem; font-weight: 800;
      box-shadow: 0 3px 10px rgba(11, 61, 145, 0.35);
    }
    @media (prefers-color-scheme: dark) { .brand { color: var(--blue-400); } }
    .nav-inner nav {
      display: flex; flex-wrap: nowrap; gap: 2px;
      overflow-x: auto; scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }
    @media (max-width: 48rem) {
      .nav-inner nav {
        mask-image: linear-gradient(90deg, #000 92%, transparent);
        -webkit-mask-image: linear-gradient(90deg, #000 92%, transparent);
      }
    }
    .nav-inner nav::-webkit-scrollbar { display: none; }
    .nav-inner nav a {
      position: relative; display: inline-flex; align-items: center; min-height: 44px;
      padding: 6px 10px; color: var(--ink); text-decoration: none; font-size: 0.93rem;
      white-space: nowrap; border-radius: 8px;
    }
    .nav-inner nav a::after {
      content: ""; position: absolute; left: 10px; right: 10px; bottom: 7px;
      height: 2px; border-radius: 2px;
      background: linear-gradient(90deg, var(--blue-600), var(--blue-400));
      transform: scaleX(0); transform-origin: 0 50%;
      transition: transform 0.22s ease;
    }
    .nav-inner nav a:hover { color: var(--blue-600); }
    .nav-inner nav a:hover::after,
    .nav-inner nav a.active::after { transform: scaleX(1); }
    .nav-inner nav a.active { color: var(--blue-600); font-weight: 700; }
    @media (prefers-color-scheme: dark) {
      .nav-inner nav a:hover, .nav-inner nav a.active { color: var(--blue-400); }
    }

    .hero {
      background: linear-gradient(135deg, var(--blue-900) 0%, var(--blue-800) 42%, var(--blue-600) 78%, var(--blue-400) 125%);
      color: #ffffff;
    }
    .hero-inner { max-width: 62rem; margin: 0 auto; padding: 44px 20px 48px; }
    .hero .en {
      font-weight: 800; font-size: 0.85rem; letter-spacing: 0.14em;
      text-transform: uppercase; color: #bcd7ff; margin: 0 0 4px;
    }
    .hero h1 { font-size: 2rem; line-height: 1.35; margin: 0 0 8px; font-weight: 800; }
    .hero .date { margin: 0; color: #eaf3ff; font-size: 0.95rem; }

    main { max-width: 62rem; margin: 0 auto; padding: 40px 20px 8px; }
    section { margin-bottom: 44px; }
    p { margin: 0 0 12px; }
    p:last-child { margin-bottom: 0; }
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 26px; box-shadow: var(--shadow);
    }
    .back { margin-top: 20px; }
    footer { border-top: 1px solid var(--border); background: var(--surface); }
    .footer-inner {
      max-width: 62rem; margin: 0 auto; padding: 22px 20px 30px;
      color: var(--muted); font-size: 0.9rem; text-align: center;
    }
  </style>
</head>
<body>
  <a class="skip" href="#main">本文へ移動</a>
  <div class="scroll-progress" aria-hidden="true"></div>

  <header class="site-nav">
    <div class="nav-inner">
      <a class="brand" href="../"><span class="mark" aria-hidden="true">A</span>Portfolio</a>
      <nav aria-label="メニュー">
        <a href="../">ホーム</a>
        <a href="./">ブログ</a>
        <a href="https://github.com/aokisoma">GitHub</a>
      </nav>
    </div>
  </header>

  <div class="hero">
    <div class="hero-inner">
      <p class="en">Blog</p>
      <h1>ホームページを開設しました</h1>
      <p class="date">2026.11.13</p>
    </div>
  </div>

  <main id="main">
    <section aria-label="記事本文">
      <article class="card">
        <p>このたび、個人ホームページを開設しました。</p>
        <p>私は山梨大学大学院の修士1年で、メカトロニクス工学を学んでいます。このホームページには、自己紹介や研究内容、これまでに取り組んだプロジェクトなどをまとめました。</p>
        <p>このブログでは、研究の進捗や日々の学び、音楽のことなども少しずつ書いていく予定です。よろしくお願いします。</p>
      </article>
      <p class="back"><a href="./">← ブログ一覧へ戻る</a>　<a href="../">ホームへ戻る</a></p>
    </section>
  </main>

  <footer>
    <div class="footer-inner">
      <p>&copy; 2026 青木 壯磨 — Built with GitHub Pages</p>
    </div>
  </footer>
  <script>
    (function () {
      var header = document.querySelector("header.site-nav");
      var bar = document.querySelector(".scroll-progress");
      if (!header) return;
      var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      var lastY = window.scrollY;
      var ticking = false;
      function update() {
        var y = window.scrollY;
        header.classList.toggle("scrolled", y > 8);
        var max = document.documentElement.scrollHeight - window.innerHeight;
        if (bar) bar.style.transform = "scaleX(" + (max > 0 ? Math.min(y / max, 1) : 0) + ")";
        if (!reduce) {
          if (y > 240 && y - lastY > 4) header.classList.add("nav-hidden");
          else if (lastY - y > 4 || y <= 240) header.classList.remove("nav-hidden");
        }
        lastY = y;
        ticking = false;
      }
      window.addEventListener("scroll", function () {
        if (!ticking) { ticking = true; window.requestAnimationFrame(update); }
      }, { passive: true });
      update();
      var links = {};
      document.querySelectorAll(".nav-inner nav a[href^='#']").forEach(function (a) {
        links[a.getAttribute("href").slice(1)] = a;
      });
      var sections = Object.keys(links).map(function (id) {
        return document.getElementById(id);
      }).filter(Boolean);
      if (sections.length && "IntersectionObserver" in window) {
        var io = new IntersectionObserver(function (entries) {
          entries.forEach(function (e) {
            if (e.isIntersecting) {
              Object.keys(links).forEach(function (k) { links[k].classList.remove("active"); });
              if (links[e.target.id]) links[e.target.id].classList.add("active");
            }
          });
        }, { rootMargin: "-40% 0px -55% 0px" });
        sections.forEach(function (s) { io.observe(s); });
      }
    })();
  </script>
</body>
</html>
